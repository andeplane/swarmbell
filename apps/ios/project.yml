name: Swarmbell
options:
  bundleIdPrefix: dev.andeplane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Swarmbell:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 7
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Swarmbell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../Sources/SwarmbellCore/Models.swift
      - path: ../../Sources/SwarmbellCore/AnalyticsModels.swift
      - path: Assets.xcassets
        optional: true
    dependencies:
      - package: Swarmbell
        product: SwarmbellCompanion
    settings:
      base:
        # Retain the installed app identity so updates preserve pairing and permissions.
        PRODUCT_BUNDLE_IDENTIFIER: dev.andeplane.AgentBeacon
        PRODUCT_NAME: Swarmbell
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Swarmbell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown by Swarmbell on your Mac.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect securely to your paired Mac to see your coding agents and their statistics.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  Swarmbell:
    build:
      targets:
        Swarmbell: all
