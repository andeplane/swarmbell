name: Swarmbell
options:
  bundleIdPrefix: dev.andeplane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Swarmbell:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 12
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Swarmbell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../Shared
        includes: ["*.swift"]
      - path: ../../Sources/SwarmbellCore/Models.swift
      - path: ../../Sources/SwarmbellCore/AnalyticsModels.swift
      - path: Assets.xcassets
        optional: true
    dependencies:
      - package: Swarmbell
        product: SwarmbellCompanion
      - target: SwarmbellWidgets
        embed: true
      - target: SwarmbellWatch
        embed: true
    settings:
      base:
        # Retain the installed app identity so updates preserve pairing and permissions.
        PRODUCT_BUNDLE_IDENTIFIER: dev.andeplane.AgentBeacon
        PRODUCT_NAME: Swarmbell
        PROVISIONING_PROFILE_SPECIFIER: $(SWARMBELL_PHONE_PROFILE)
        CODE_SIGN_ENTITLEMENTS: Swarmbell.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Swarmbell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown by Swarmbell on your Mac.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect securely to your paired Mac to see your coding agents and their statistics.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SwarmbellWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: ../Shared
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andeplane.AgentBeacon.widgets
        PRODUCT_NAME: SwarmbellWidgets
        PROVISIONING_PROFILE_SPECIFIER: $(SWARMBELL_WIDGET_PROFILE)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WidgetsInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: Swarmbell
        CODE_SIGN_ENTITLEMENTS: Swarmbell.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  SwarmbellWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../watch/Sources
      - path: ../Shared
        includes: ["*.swift"]
      - path: ../watch/Assets.xcassets
    dependencies:
      - target: SwarmbellWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andeplane.AgentBeacon.watchkitapp
        PRODUCT_NAME: SwarmbellWatch
        PROVISIONING_PROFILE_SPECIFIER: $(SWARMBELL_WATCH_PROFILE)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Swarmbell
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.andeplane.AgentBeacon
        CODE_SIGN_ENTITLEMENTS: Swarmbell.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  SwarmbellWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../watch/Widgets
      - path: ../Shared
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andeplane.AgentBeacon.watchkitapp.widgets
        PRODUCT_NAME: SwarmbellWatchWidgets
        PROVISIONING_PROFILE_SPECIFIER: $(SWARMBELL_COMPLICATION_PROFILE)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WidgetsInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: Swarmbell
        CODE_SIGN_ENTITLEMENTS: Swarmbell.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  Swarmbell:
    build:
      targets:
        Swarmbell: all
  SwarmbellWatch:
    build:
      targets:
        SwarmbellWatch: all
